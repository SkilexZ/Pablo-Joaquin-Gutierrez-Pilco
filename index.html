<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo Joaquin Gutierrez Pilco | Portafolio</title>
    
    <meta name="google-site-verification" content="" />

    <style>
        /* =========================================
           VARIABLES Y CONFIGURACIÓN GLOBAL
           ========================================= */
        :root {
            --bg-dark: #000000;
            --bg-card: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #1a1a1a;
            --border-hover: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--text-muted);
        }

        /* =========================================
           FONDO FIJO CON EFECTO BLUR (fondow2.jpeg)
           ========================================= */
        #hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            /* SE ACTUALIZÓ EL NOMBRE DEL ARCHIVO AQUÍ */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.9)), url('fondow2.jpeg') center/cover no-repeat;
            z-index: -1;
            will-change: filter, opacity; 
        }

        /* =========================================
           NAVEGACIÓN (NAVBAR) Y LOGO INTERACTIVO
           ========================================= */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: padding 0.4s ease, background 0.4s ease;
        }

        /* Contenedor y diseño del nuevo logo */
        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 50px; /* Altura ideal para un navbar */
            width: auto;
            border-radius: 4px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s ease;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.1));
        }

        /* Interacción: Escala suave y brillo al pasar el cursor */
        .logo-img:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .btn-outline {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 24px;
            border-radius: 30px;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-outline:hover {
            background-color: var(--text-main);
            color: var(--bg-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        /* =========================================
           ANIMACIÓN DE APARICIÓN AL BAJAR (FADE-UP)
           ========================================= */
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================
           CONTENEDOR PRINCIPAL
           ========================================= */
        .content-wrapper {
            position: relative;
            z-index: 1;
            margin-top: 100vh;
            background-color: var(--bg-dark);
        }

        /* =========================================
           SECCIÓN 1: INICIO (HERO)
           ========================================= */
        .hero {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
            pointer-events: none;
        }

        .hero * {
            pointer-events: auto;
        }

        .badge {
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 25px;
            width: max-content;
            transition: border-color 0.3s ease;
        }

        .badge:hover {
            border-color: rgba(255,255,255,0.6);
        }

        .hero h1 {
            font-size: 5em;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            max-width: 900px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.2em;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 600px;
        }

        /* =========================================
           SECCIÓN 2: SOBRE MÍ
           ========================================= */
        .about {
            padding: 120px 8%;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .about-text h2 {
            font-size: 3em;
            margin-bottom: 30px;
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.1em;
            max-width: 800px;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
            margin-top: 50px;
        }

        .stat-box {
            background-color: var(--bg-card);
            padding: 30px 25px;
            border-radius: 16px;
            flex: 1;
            border: 1px solid var(--border-color);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: default;
        }

        .stat-box:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            background-color: #121212;
        }

        .stat-box h3 {
            font-size: 3em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-box p {
            font-size: 0.9em;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* =========================================
           SECCIÓN 3: Á
